apiVersion: v1
kind: Pod
metadata:
  labels:
    run: ubuntu
    service: ubuntao
  name: ubuntu
spec:
  containers:
  - image: ubuntu
    name: ubuntu
    args: 
    - sleep
    - "1700"
    resources: 
      limits:
        cpu: "1.5"
        memory: "256Mi"
      requests:
        cpu: "0.33"
        memory: "128Mi"
  dnsPolicy: ClusterFirst
  restartPolicy: Always
status: {}
